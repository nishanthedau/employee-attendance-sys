<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="auth-form" style="min-height: 100vh;">
    <div class="auth-card center">
      <div class="brand" style="justify-content: center;"><span class="mark"></span>Attendance<em>.</em></div>
      <p class="muted mt-8">Redirecting…</p>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    const u = API.user();
    if (API.token() && u) {
      window.location.href = u.role === "admin" ? "/admin" : "/student";
    } else {
      window.location.href = "/login";
    }
  </script>
</body>
</html>
