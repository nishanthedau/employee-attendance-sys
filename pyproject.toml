[project]
name = "attendance-system"
version = "0.1.0"
description = "QR-based attendance management system"
readme = "README.md"
authors = [
    { name = "Nishant", email = "fuz.nishant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic-settings>=2.6",
    "segno>=1.6",
    "bcrypt>=4.2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
