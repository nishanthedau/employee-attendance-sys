[project]
name = "attendance-system"
version = "0.1.0"
description = "QR-based attendance management system"
readme = "README.md"
authors = [
    { name = "Nishant", email = "fuz.nishant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic-settings>=2.6",
    "segno>=1.6",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.0",
    "geoip2>=5.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: Depends(...) in default args is idiomatic FastAPI.
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP", "SIM"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
